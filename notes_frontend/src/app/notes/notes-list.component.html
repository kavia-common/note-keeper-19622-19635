<div class="notes-list">
  <ng-container *ngIf="notes?.length; else empty">
    <div class="note-row surface" *ngFor="let n of notes">
      <div class="note-main" (click)="view.emit(n)" title="View details">
        <div class="note-title">{{ n.title || 'Untitled' }}</div>
        <div class="note-meta text-muted">
          <span class="badge">Updated {{ format(n.updatedAt || n.createdAt) }}</span>
        </div>
      </div>
      <div class="note-actions">
        <button class="btn ghost" (click)="edit.emit(n)" title="Edit">Edit</button>
        <button class="btn danger" (click)="delete.emit(n)" title="Delete">Delete</button>
      </div>
    </div>
  </ng-container>

  <ng-template #empty>
    <div class="empty-state surface">
      <div style="font-weight:700;color:var(--ocean-primary);margin-bottom:8px;">No notes yet</div>
      <div class="text-muted">Click "New Note" to create your first one.</div>
    </div>
  </ng-template>
</div>
